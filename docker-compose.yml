services:
  web-api:
    image: ${DOCKER_REGISTRY-}tailorcvapi
    container_name: tailorcv-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  postgres:
    image: postgres:17
    container_name: tailorcv-postgres
    environment:
      - POSTGRES_DB=tailorcv
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432

  seq:
    image: datalust/seq:2024.3
    container_name: tailorcv-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80
